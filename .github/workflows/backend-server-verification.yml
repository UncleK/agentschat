name: Backend And Flutter Verification

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  backend-server-verification:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml

      - name: Install backend dependencies
        run: pnpm --dir server install --frozen-lockfile

      - name: Lint backend
        run: pnpm --dir server lint

      - name: Typecheck backend
        run: pnpm --dir server typecheck

      - name: Build backend
        run: pnpm --dir server build

      - name: Run deterministic backend unit bucket
        run: pnpm --dir server test:unit

      - name: Start backend integration services
        run: |
          docker compose -f server/docker-compose.yml build minio
          docker compose -f server/docker-compose.yml up -d postgres redis minio
          for attempt in $(seq 1 60); do
            if docker exec agents-chat-postgres pg_isready -U agents_chat -d agents_chat; then break; fi
            sleep 2
          done
          docker exec agents-chat-postgres pg_isready -U agents_chat -d agents_chat
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:9000/minio/health/live

      - name: Run backend integration bucket
        run: pnpm --dir server test:integration

      - name: Run release-critical backend e2e bucket
        run: pnpm --dir server test:e2e --json --outputFile=../audit-e2e-results.json

      - name: Verify actual Python terminal and browser binding against isolated PostgreSQL
        run: bash server/test/audit/run-binding-browser.sh

      - name: Preserve actual verification results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: audit-v1.2-verification
          path: |
            audit-e2e-results.json
            output/reaudit/browser-result.txt
            output/reaudit/pty-result.json
            output/reaudit/web-build.log

      - name: Stop backend integration services
        if: always()
        run: docker compose -f server/docker-compose.yml down -v

  flutter-app-verification:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: app

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run Flutter analyze
        run: flutter analyze

      - name: Run Flutter logic and widget tests
        run: find test -name '*_test.dart' ! -path 'test/goldens/*' -print0 | xargs -0 flutter test

      - name: Build Flutter release APK
        run: flutter build apk --release

  flutter-app-integration-verification:
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh
        working-directory: app

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true

      - name: Enable Windows desktop support
        run: flutter config --enable-windows-desktop

      - name: Check PowerShell installer branch migration in isolation
        working-directory: .
        run: python skills/agents-chat-v1/adapter/installer_repo_test.py --shell powershell -v

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run app shell integration verification
        run: flutter test integration_test/app_shell_navigation_test.dart -d windows

      # Pixel baselines are maintained on Windows with this pinned Flutter SDK.
      - name: Run Flutter golden comparisons
        run: flutter test test/goldens

      - name: Run hub integration verification
        run: flutter test integration_test/hub_flow_test.dart -d windows

      - name: Run chat integration verification
        run: flutter test integration_test/chat_flow_test.dart -d windows

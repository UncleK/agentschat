name: Dependency Security And Plugin Compatibility
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dependencies: [locked, compatible-latest]
    defaults:
      run:
        working-directory: plugins/agentschatapp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: plugins/agentschatapp/package-lock.json
      - run: npm ci --ignore-scripts
      - if: matrix.dependencies == 'compatible-latest'
        run: npm update openclaw --ignore-scripts
      - if: matrix.dependencies == 'compatible-latest'
        name: Update vulnerable dependencies bundled inside OpenClaw's npm CLI
        run: |
          # Bundled dependencies ignore root overrides. Update real installed
          # packages, then rebuild both lock inventories from the actual tree.
          # Published npm tarballs include unpublished development-only tools.
          npm pkg delete devDependencies --prefix node_modules/npm
          npm install --prefix node_modules/npm --omit=dev --ignore-scripts --save-exact \
            brace-expansion@5.0.12 http-cache-semantics@4.3.0 ip-address@10.7.1 \
            postcss-selector-parser@7.1.6 undici@6.28.1
          mv package-lock.json "$RUNNER_TEMP/openclaw-before-bundle-package-lock.json"
          mv node_modules/.package-lock.json "$RUNNER_TEMP/openclaw-before-bundle-install-lock.json"
          npm install --ignore-scripts
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          for (const [name, version] of Object.entries({
            'brace-expansion': '5.0.12', 'http-cache-semantics': '4.3.0',
            'ip-address': '10.7.1', 'postcss-selector-parser': '7.1.6', undici: '6.28.1',
          })) {
            const path = `node_modules/npm/node_modules/${name}`;
            assert.equal(JSON.parse(readFileSync(`${path}/package.json`, 'utf8')).version, version);
            assert.equal(lock.packages[path].version, version);
          }
          JS
          node node_modules/npm/bin/npm-cli.js --version
      - run: npm audit --audit-level=low
      - run: npm run build
      - run: npm test
      - run: npm pack --dry-run
      - if: matrix.dependencies == 'locked'
        name: Verify checked-in plugin build
        run: git diff --exit-code -- dist
  backend-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml
      - run: pnpm --dir server install --frozen-lockfile --ignore-scripts
      - run: pnpm --dir server audit --audit-level=low
  web-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low

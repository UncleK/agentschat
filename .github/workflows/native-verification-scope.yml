name: Native Verification Scope

on:
  workflow_call:
    outputs:
      app:
        value: ${{ jobs.paths.outputs.app }}
      windows_adapter:
        value: ${{ jobs.paths.outputs.windows_adapter }}

jobs:
  paths:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.diff.outputs.app }}
      windows_adapter: ${{ steps.diff.outputs.windows_adapter }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compare native verification inputs
        id: diff
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # PR runs compare the base with GitHub's test merge commit.
          # Run the checks if either revision is unavailable or the diff fails.
          changed() {
            if [[ -n "$BASE_SHA" ]] && git diff --quiet --no-ext-diff "$BASE_SHA" "$GITHUB_SHA" -- "$@"; then
              echo false
            else
              echo true
            fi
          }

          {
            echo "app=$(changed app/)"
            echo "windows_adapter=$(changed skills/agents-chat-v1/adapter/)"
          } >> "$GITHUB_OUTPUT"
